[package]
name = "zerobus-mock-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Conformance mock Zerobus server: Zerobus data plane + MockAdmin control plane"
# This crate lives outside the rust/ directory, so point explicitly at the workspace root
# (a sibling, not an ancestor) to inherit [workspace.dependencies] and unify crate versions.
workspace = "../../rust"

[lib]
name = "zerobus_mock_server"
path = "src/lib.rs"

[[bin]]
name = "zerobus-mock-server"
path = "src/main.rs"

[dependencies]
# Zerobus proto types come from the shared test-support crate (which generates the server
# bindings from sdk/zerobus_service.proto); the SDK itself no longer re-exports them publicly.
# Shared crates use `workspace = true` to unify versions.
zerobus-test-support = { path = "../../rust/test-support" }
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true, features = ["transport", "codegen"] }
tonic-prost = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "net", "signal", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
# Self-tests drive the real Rust SDK against the mock, so `make test` exercises the mock's
# gRPC behavior in CI. The `testing` feature enables the SDK's test seams.
databricks-zerobus-ingest-sdk = { path = "../../rust/sdk", features = ["testing"] }

[lints.clippy]
# async-trait stamps #[must_use] on tonic's generated server methods that already return a
# #[must_use] future; clippy >= 1.99 flags the redundancy. Same allow as the SDK/test-support.
double_must_use = "allow"
