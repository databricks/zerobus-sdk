[package]
name = "zerobus-mock-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Conformance mock Zerobus server: Zerobus data plane + MockAdmin control plane"

# Standalone crate: not a member of the rust/ workspace.
[workspace]

[lib]
name = "zerobus_mock_server"
path = "src/lib.rs"

[[bin]]
name = "zerobus-mock-server"
path = "src/main.rs"

[dependencies]
# The Zerobus proto types are reused from the SDK (see src/lib.rs proto module) so the mock,
# the SDK, and rust/tests all share one set of generated types.
databricks-zerobus-ingest-sdk = { path = "../../rust/sdk" }
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", features = ["transport", "codegen"] }
tonic-prost = "0.14"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "net", "signal", "time"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Scripted mock's self-signed TLS certs (ported from rust/tests). `time` is pinned to match
# rust/tests and avoid pulling a newer release that raises the Rust version floor.
rcgen = "0.13"
time = "=0.3.36"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.0.0"
