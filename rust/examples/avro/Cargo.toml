[package]
name = "example_avro"
version = "0.1.0"
edition = "2021"
publish = false

[[example]]
name = "avro_single"
path = "single.rs"

[[example]]
name = "avro_batch"
path = "batch.rs"

[[example]]
name = "avro_multiplexed"
path = "multiplexed.rs"

[dependencies]
databricks-zerobus-ingest-sdk = { path = "../../sdk", features = ["avro"] }
# Same apache-avro version as the SDK, so `AvroValue` (re-exported by the SDK) and the
# `Schema` / `to_avro_datum` used here to pre-encode the `AvroBytes` datums are the same types.
apache-avro = "0.20"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
databricks-zerobus-ingest-sdk = { path = "../../sdk", features = ["testing"] }
prost-types = "0.14"
rcgen = "0.13"
# rcgen allows newer time releases that require Rust 1.88; keep the Avro
# feature's standalone tests compatible with its Rust 1.85 floor.
time = "=0.3.36"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-native-roots", "transport"] }
tracing = "0.1"
